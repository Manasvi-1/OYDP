name: API smoke
on:
  pull_request:
  push:
    branches: [main, feat/property-identity-foundation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt
      - run: PYTHONPATH=apps/api python -m pytest -q apps/api/tests

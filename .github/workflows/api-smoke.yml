name: API smoke
on:
  pull_request:
  push:
    branches: [main, feat/property-identity-foundation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r apps/api/requirements.lock
      - run: PYTHONPATH=apps/api:. python -m pytest -q apps/api/tests
      - run: PYTHONPATH=apps/api:. python scripts/export_active_openapi.py --check
      - run: python -m compileall -q apps/api/app scripts
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r apps/api/requirements.lock

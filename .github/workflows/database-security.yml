# Active canonical API + infra/db (public schema, oydp_app). Not the reference oydp schema.
name: Active database security
on:
  pull_request:
  push:
    branches: [main, feat/property-identity-foundation]
permissions:
  contents: read
jobs:
  postgres-isolation:
    name: apps/api + infra/db acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oydp_security_test
          POSTGRES_PASSWORD: disposable-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oydp_security_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only-password@localhost:5432/oydp_security_test
      PYTHONPATH: apps/api:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r apps/api/requirements.lock
      - run: python -m pytest -q apps/api/tests tests/integration --junitxml=test-results/database.xml
      - run: python scripts/check_test_report.py test-results/database.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-security-results
          path: test-results/database.xml

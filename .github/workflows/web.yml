name: Web workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oydp_web_e2e
          POSTGRES_PASSWORD: disposable-browser-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oydp_web_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-browser-admin@127.0.0.1:5432/oydp_web_e2e
      OYDP_BROWSER_DISPOSABLE: 'yes'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r ../api/requirements.lock
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dependency-lock
          path: apps/web/package-lock.json

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: oydp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oydp"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pgdata:

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: oydp
      POSTGRES_USER: oydp_admin
      POSTGRES_PASSWORD: ${OYDP_LOCAL_DB_ADMIN_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oydp_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oydp_admin -d oydp"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  oydp_database:
